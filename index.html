<script>
  // Tema sayfa çizilmeden önce uygulanır (açılışta beyaz parlama olmasın)
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem("umauma.theme")); } catch (e) {}
    if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
